<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>4 FUN — Admin Panel</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin-body">

  <!-- ---------- Login screen ---------- -->
  <div class="admin-login" id="adminLogin">
    <div class="admin-login-card">
      <img src="assets/logo.svg" alt="" class="admin-login-logo" />
      <h1>4 FUN Admin</h1>
      <p>Enter your admin PIN to continue.</p>
      <form id="pinForm">
        <input type="password" id="pinInput" class="admin-input" placeholder="Admin PIN" autocomplete="off" />
        <button type="submit" class="btn btn-red btn-block">Unlock</button>
      </form>
      <a href="index.html" class="admin-back">&larr; Back to site</a>
    </div>
  </div>

  <!-- ---------- Dashboard ---------- -->
  <div class="admin-dash hidden" id="adminDash">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-head">
        <img src="assets/logo.svg" alt="" class="brand-logo" />
        <span class="brand-text">4 <b>FUN</b></span>
      </div>
      <nav class="admin-tabs" id="adminTabs">
        <button class="admin-tab active" data-tab="hero">Hero</button>
        <button class="admin-tab" data-tab="about">About</button>
        <button class="admin-tab" data-tab="rules">Rules</button>
        <button class="admin-tab" data-tab="staff">Staff</button>
        <button class="admin-tab" data-tab="events">Events</button>
        <button class="admin-tab" data-tab="gallery">Gallery</button>
        <button class="admin-tab" data-tab="perks">Perks</button>
        <button class="admin-tab" data-tab="faq">FAQ</button>
        <button class="admin-tab" data-tab="settings">Settings</button>
      </nav>
      <div class="admin-sidebar-foot">
        <a href="index.html" class="admin-link-btn">View Site</a>
        <button id="logoutAdmin" class="admin-link-btn danger">Log out</button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <h1 id="panelTitle">Hero</h1>
        <p id="panelSub">Edit content and save. Changes appear on the site immediately.</p>
      </header>

      <div class="admin-content" id="adminContent"></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
