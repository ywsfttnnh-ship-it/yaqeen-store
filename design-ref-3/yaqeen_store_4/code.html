<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        .glass-panel {
            background: linear-gradient(135deg, rgba(45, 45, 45, 0.8) 0%, rgba(30, 27, 25, 0.6) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .floating-shadow {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }
        .hover-lift {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .hover-lift:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }
    </style>

<body class="antialiased min-h-screen overflow-hidden flex font-body-md">
<!-- Background Canvas -->
<main class="flex-1 relative transition-all duration-500 ease-in-out pr-0" id="main-content">
<!-- Content behind overlay to show glassmorphism -->
<div class="absolute inset-0 z-0">

<div class="absolute inset-0 bg-gradient-to-t from-background via-transparent to-background"></div>
</div>
<div class="relative z-10 flex items-center justify-center h-full">
<h1 class="font-display-xl text-display-xl text-outline-variant opacity-20">Yaqeen Gallery</h1>
</div>
</main>
<!-- Overlay Backdrop -->
<div class="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 transition-opacity duration-300" id="overlay-backdrop"></div>

<!-- Header -->
<header class="flex items-center justify-between px-8 py-6 border-b border-white/5">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-gold-leaf">سلة المشتريات</h2>
<button class="text-on-surface-variant hover:text-primary transition-colors p-2 rounded-full hover:bg-white/5" onclick="closeCart()">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<!-- Tabs -->
<div class="flex px-8 pt-4 border-b border-white/5">
<button class="flex-1 pb-4 text-center font-label-sm text-label-sm text-primary border-b-2 border-gold-leaf">السلة (3)</button>
<button class="flex-1 pb-4 text-center font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-colors">المفضلة</button>
</div>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto px-8 py-6 space-y-6">

</div>
<div class="flex-1">
<div class="flex justify-between items-start">
<div>
<h3 class="font-body-xl text-body-xl text-on-surface mb-1">خشب باركيه فاخر</h3>
<p class="font-body-md text-body-md text-on-surface-variant">لون الجوز الداكن</p>
</div>
<button class="text-on-surface-variant hover:text-error transition-colors p-1">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button>
</div>
<div class="flex justify-between items-center mt-4">
<div class="flex items-center gap-3 bg-surface-container px-3 py-1 rounded-full border border-white/5">
<button class="text-on-surface-variant hover:text-primary"><span class="material-symbols-outlined text-[16px]">remove</span></button>
<span class="font-label-sm text-label-sm w-4 text-center">12</span>
<button class="text-on-surface-variant hover:text-primary"><span class="material-symbols-outlined text-[16px]">add</span></button>
</div>
<span class="font-headline-lg-mobile text-[24px] font-semibold text-primary">₪ 145</span>
</div>
</div>
</div>

<img class="w-full h-full object-cover" data-alt="A macro shot of a sophisticated light grey marble slab sample. Fine white veins run organically through the stone. The lighting brings out a subtle sheen on the polished surface, presenting an elegant and modern aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBZQejyydJmuYY5OWmn0z2RSAMBfqXK0z2zQhmQrqaGAfxOjnCPZwY89T-0Jv-XNVQtKoNiCY_wXQFH5J6Dk4kSmWeUvDeH9cDSKrV_FHY1YBuN6RyLGehltlLNmnuP1SpYtHCLA6i3KlrP0MEV4mXqyoW7Hx0MjhI4VMqwbXsS1cd-Zgf_kbN2bGhAcYy83GfaEN2AGwZ_Wr8c6XCvtSqtuKJt6IPCGDBEY5zWl4Eui-Wd8G0UHPmnrw"/>
</div>
<div class="flex-1">
<div class="flex justify-between items-start">
<div>

</div>
<button class="text-on-surface-variant hover:text-error transition-colors p-1">

</button>
</div>
<div class="flex justify-between items-center mt-4">
<div class="flex items-center gap-3 bg-surface-container px-3 py-1 rounded-full border border-white/5">
<button class="text-on-surface-variant hover:text-primary"><span class="material-symbols-outlined text-[16px]">remove</span></button>
<span class="font-label-sm text-label-sm w-4 text-center">5</span>
<button class="text-on-surface-variant hover:text-primary"><span class="material-symbols-outlined text-[16px]">add</span></button>
</div>
<span class="font-headline-lg-mobile text-[24px] font-semibold text-primary">₪ 280</span>
</div>
</div>
</div>
</div>
<!-- Footer / Checkout -->
<div class="px-8 py-6 border-t border-white/5 bg-surface-container-lowest/50">

<span class="font-body-xl text-body-xl text-on-surface-variant">الإجمالي المبدئي</span>
<span class="font-display-lg text-[40px] text-gold-leaf">₪ 3,140</span>
</div>
<button class="w-full bg-gold-leaf text-on-primary py-4 rounded-xl font-label-sm text-label-sm uppercase tracking-widest hover:bg-primary-fixed transition-all duration-300 shadow-[0_0_20px_rgba(197,160,89,0.3)] hover:shadow-[0_0_30px_rgba(197,160,89,0.5)] flex justify-center items-center gap-2">
                إتمام الطلب
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<p class="text-center font-label-sm text-[12px] text-on-surface-variant mt-4 opacity-70">الأسعار لا تشمل الضريبة المضافة والتوصيل</p>
</div>
</aside>
<script>
        function closeCart() {
            document.getElementById('cart-drawer').style.transform = 'translateX(100%)';
            document.getElementById('overlay-backdrop').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('overlay-backdrop').style.display = 'none';
            }, 300);
        }
    </script>
</body></html>
